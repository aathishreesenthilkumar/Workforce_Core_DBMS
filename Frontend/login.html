<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Workforce Core // Marco Madonna Aesthetic</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Marco Madonna Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden !important;
            margin: 0;
            padding: 0;
        }
        .login-top-bar {
            padding: 0.45rem 1.5rem !important;
            flex-shrink: 0;
        }
        .login-stage {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 1rem;
        }
        .login-box {
            max-width: 450px;
            width: 100%;
            padding: 1.15rem 1.5rem !important;
            margin: auto;
            border-radius: 12px;
        }
        .login-box .form-control {
            padding: 0.38rem 0.75rem !important;
            font-size: 0.85rem !important;
        }
        .login-box .form-select {
            padding: 0.32rem 0.65rem !important;
            font-size: 0.78rem !important;
        }
        .login-box .btn-gs {
            padding: 0.48rem 1rem !important;
            font-size: 0.82rem !important;
        }
        .login-box .role-chip {
            padding: 0.22rem 0.45rem !important;
            font-size: 0.72rem !important;
            white-space: nowrap;
        }
        .login-box .alert {
            padding: 0.4rem 0.75rem;
            font-size: 0.78rem;
            margin-bottom: 0.6rem;
        }
    </style>
</head>
<body class="d-flex flex-column">

    <!-- Translucent Glassmorphic Top Bar -->
    <header class="top-chrome login-top-bar">
        <a href="login.html" class="chrome-brand">
            <span class="brand-beacon"></span>
            <span>Workforce <em>Core</em></span>
            <span class="pill-tag dark ms-2" style="font-size: 0.72rem;">DBMS 23CS2013</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="pill-tag" style="font-size: 0.72rem;">
                <span class="brand-beacon" style="width: 6px; height: 6px;"></span>
                POSTGRESQL RELATIONAL ENGINE
            </span>
        </div>
    </header>

    <!-- Main Centered Authentication Stage (Locked to Viewport, No Scroll) -->
    <main class="login-stage">
        <div class="card login-box">
            
            <!-- Editorial Masthead inside Box -->
            <div class="mb-2 pb-2 border-bottom" style="border-color: var(--border) !important;">
                <div class="d-flex align-items-center justify-content-between mb-1">
                    <span class="hero-tag mb-0" style="font-size: 0.72rem;">
                        <span class="brand-beacon" style="width: 6px; height: 6px;"></span>
                        AUTH GATE // 01
                    </span>
                    <span class="pill-tag dark" style="font-size: 0.68rem;">3NF VERIFIED</span>
                </div>
                <h2 class="fw-bold mb-0" style="letter-spacing: -0.04em; font-size: 1.45rem; color: var(--text);">
                    Sign In <em>Portal</em>
                </h2>
                <p class="text-muted small mb-0 font-monospace" style="font-size: 0.74rem; color: var(--text-2) !important;">
                    Employee Portal &bull; Attendance, Payroll & Leave Management
                </p>
            </div>

            <div id="alertContainer"></div>

            <!-- Fast Role Picker Chips & 32-Employee Selector -->
            <div class="mb-2">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="font-monospace text-uppercase mb-0" style="font-size: 0.72rem; letter-spacing: 0.06em; color: var(--accent-text);">
                        Select Role Preset:
                    </label>
                    <span class="font-monospace" style="font-size: 0.68rem; color: var(--text-muted);">32 Accounts</span>
                </div>
                <div class="d-flex gap-1 mb-1">
                    <button type="button" class="role-chip demo-btn active flex-fill text-center" data-user="admin" data-pass="admin123">
                        <i class="fa-solid fa-shield-halved"></i> Admin
                    </button>
                    <button type="button" class="role-chip demo-btn flex-fill text-center" data-user="isabella_hr" data-pass="manager123">
                        <i class="fa-solid fa-user-tie"></i> HR
                    </button>
                    <button type="button" class="role-chip demo-btn flex-fill text-center" data-user="olivia_fin" data-pass="manager123">
                        <i class="fa-solid fa-calculator"></i> Finance
                    </button>
                    <button type="button" class="role-chip demo-btn flex-fill text-center" data-user="brianne_db" data-pass="emp123">
                        <i class="fa-solid fa-user"></i> Staff
                    </button>
                </div>

                <!-- Complete 32-Employee Dropdown Selector -->
                <select id="allEmployeesSelect" class="form-select font-monospace" style="background: var(--glass-bg); color: var(--text); border-color: var(--border);">
                    <option value="">-- Or Choose Any of 32 Employees --</option>
                </select>
                <div id="selectedUserBadge" class="mt-1 font-monospace small" style="font-size: 0.72rem; color: var(--accent-text); display: none;"></div>
            </div>

            <!-- Form Controls -->
            <form id="loginForm">
                <div class="mb-2">
                    <label for="username" class="d-block font-monospace text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.05em; color: var(--text-2);">
                        Username / Identifier
                    </label>
                    <input type="text" class="form-control" id="username" value="admin" placeholder="e.g. admin" required autofocus>
                </div>

                <div class="mb-2 pb-1">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="font-monospace text-uppercase mb-0" style="font-size: 0.72rem; letter-spacing: 0.05em; color: var(--text-2);">
                            Password
                        </label>
                        <span class="font-monospace" style="font-size: 0.68rem; color: var(--text-muted);">BCrypt Encrypted</span>
                    </div>
                    <input type="password" class="form-control" id="password" value="admin123" placeholder="••••••••" required>
                </div>

                <button type="submit" id="loginBtn" class="btn-gs w-100 py-2 text-uppercase">
                    <span>Authenticate Session</span>
                    <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>

            <!-- Footer Footnote -->
            <div class="mt-2 pt-2 border-top text-center" style="border-color: var(--border) !important;">
                <div class="font-monospace" style="font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);">
                    Karunya Institute of Technology and Sciences &bull; Course 23CS2013
                </div>
            </div>

        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        const credsMap = {
            admin: { user: 'admin', pass: 'admin123' },
            isabella_hr: { user: 'isabella_hr', pass: 'manager123' },
            brianne_db: { user: 'brianne_db', pass: 'emp123' }
        };

        function setCredentials(user, pass) {
            const uField = document.getElementById('username');
            const pField = document.getElementById('password');
            if (uField && pField) {
                uField.value = user;
                pField.value = pass;
            }
        }

        document.querySelectorAll('.demo-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const u = btn.getAttribute('data-user');
                const p = btn.getAttribute('data-pass');
                setCredentials(u, p);
                const sel = document.getElementById('allEmployeesSelect');
                if (sel) sel.value = '';
                const badge = document.getElementById('selectedUserBadge');
                if (badge) badge.style.display = 'none';
            });
        });

        // Load all 32 employee accounts dynamically
        async function loadAllAccounts() {
            try {
                const res = await App.fetchAPI('/api/auth/demo-users');
                if (res && res.users && res.users.length > 0) {
                    const select = document.getElementById('allEmployeesSelect');
                    const depts = {};
                    res.users.forEach(u => {
                        const d = u.department_name || 'General';
                        if (!depts[d]) depts[d] = [];
                        depts[d].push(u);
                    });

                    select.innerHTML = '<option value="">-- Choose Any Employee Account (All ' + res.users.length + ' Available) --</option>';
                    Object.keys(depts).forEach(deptName => {
                        const group = document.createElement('optgroup');
                        group.label = `Dept: ${deptName}`;
                        depts[deptName].forEach(u => {
                            const opt = document.createElement('option');
                            const defaultPw = u.role === 'ADMIN' ? 'admin123' : u.role === 'MANAGER' ? 'manager123' : 'emp123';
                            opt.value = u.username;
                            opt.setAttribute('data-password', defaultPw);
                            opt.setAttribute('data-name', u.full_name);
                            opt.setAttribute('data-role', u.role);
                            opt.setAttribute('data-desig', u.designation);
                            opt.textContent = `${u.employee_code} • ${u.full_name} (${u.role}: ${u.designation})`;
                            group.appendChild(opt);
                        });
                        select.appendChild(group);
                    });

                    select.addEventListener('change', () => {
                        const selOpt = select.selectedOptions[0];
                        if (selOpt && selOpt.value) {
                            const u = selOpt.value;
                            const p = selOpt.getAttribute('data-password');
                            const name = selOpt.getAttribute('data-name');
                            const desig = selOpt.getAttribute('data-desig');
                            const role = selOpt.getAttribute('data-role');
                            setCredentials(u, p);
                            document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
                            const badge = document.getElementById('selectedUserBadge');
                            badge.style.display = 'block';
                            badge.innerHTML = `<i class="fa-solid fa-circle-check text-success me-1"></i> Selected: <strong>${name}</strong> [${role}: ${desig}] (Password: <code>${p}</code>)`;
                        }
                    });
                }
            } catch (err) {
                console.warn('Demo users note:', err.message);
            }
        }
        loadAllAccounts();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const res = await App.fetchAPI('/api/auth/login', {
                    method: 'POST',
                    body: { username, password }
                });

                if (res && res.success) {
                    App.showAlert('alertContainer', 'Authentication successful. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    throw new Error(res.message || 'Login failed');
                }
            } catch (err) {
                App.showAlert('alertContainer', err.message || 'Invalid username or password.', 'danger');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>Authenticate Session</span><i class="fa-solid fa-arrow-right ms-2"></i>';
            }
        });
    </script>
</body>
</html>
